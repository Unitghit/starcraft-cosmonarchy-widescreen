name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and verify release
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Upload configurator artifact
        uses: actions/upload-artifact@v4
        with:
          name: starcraft-cosmonarchy-widescreen-windows
          path: |
            artifacts/release/Cosmonarchy Widescreen Settings.exe
            artifacts/release/SHA256SUMS.txt
            artifacts/release/StarCraft-Cosmonarchy-Widescreen-v0.3.1.zip
          if-no-files-found: error
